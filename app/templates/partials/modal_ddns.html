    <div id="ddns-modal" class="modal-backdrop">
        <div class="card w-full max-w-lg max-h-[92vh] overflow-y-auto">
            <div class="flex items-start justify-between gap-4 mb-5">
                <div>
                    <h2 class="text-lg font-bold text-slate-100">Cloudflare DDNS</h2>
                    <p class="text-xs text-slate-500 mt-1" id="ddns-status">VPS 公網 IP 變動時會自動同步 A 記錄</p>
                </div>
                <button class="settings-close text-slate-400 hover:text-white text-xl leading-none" data-modal="ddns-modal">&times;</button>
            </div>
            <div class="space-y-4">
                <label class="flex items-center gap-2 text-sm text-slate-300">
                    <input id="ddns-enabled" type="checkbox" class="h-4 w-4 accent-emerald-400">
                    啟用 Cloudflare DDNS
                </label>
                <label class="block text-xs text-slate-400 uppercase">Cloudflare API Token
                    <input id="ddns-token" type="password" class="form-input" autocomplete="off">
                </label>
                <label class="block text-xs text-slate-400 uppercase">完整域名
                    <input id="ddns-record-name" class="form-input" placeholder="vps.example.com" autocomplete="off">
                </label>
                <label class="block text-xs text-slate-400 uppercase">主網域或 Zone ID（可留空）
                    <input id="ddns-zone-id" class="form-input" placeholder="留空自動偵測，例如 example.com" autocomplete="off">
                </label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="block text-xs text-slate-400 uppercase">檢查間隔
                        <select id="ddns-interval" class="form-input">
                            <option value="1">每 1 分鐘</option>
                            <option value="2">每 2 分鐘</option>
                            <option value="5">每 5 分鐘</option>
                            <option value="10">每 10 分鐘</option>
                            <option value="30">每 30 分鐘</option>
                            <option value="60">每 60 分鐘</option>
                        </select>
                    </label>
                    <label class="block text-xs text-slate-400 uppercase">TTL
                        <select id="ddns-ttl" class="form-input">
                            <option value="1">自動</option>
                            <option value="60">1 分鐘</option>
                            <option value="120">2 分鐘</option>
                            <option value="300">5 分鐘</option>
                            <option value="600">10 分鐘</option>
                            <option value="3600">1 小時</option>
                        </select>
                    </label>
                </div>
                <label class="flex items-center gap-2 text-sm text-slate-300">
                    <input id="ddns-proxied" type="checkbox" class="h-4 w-4 accent-orange-400">
                    啟用 Cloudflare 代理雲朵（開啟時 TTL 固定為自動）
                </label>
                <label class="flex items-center gap-2 text-sm text-slate-300">
                    <input id="ddns-notify" type="checkbox" class="h-4 w-4 accent-sky-400">
                    IP 變更或更新失敗時發 Telegram 通知
                </label>
                <p class="text-[11px] text-slate-500 -mt-2" id="ddns-notify-hint"></p>
                <div class="rounded border border-slate-700 bg-slate-900/60 p-3 text-[11px] font-mono text-slate-400 space-y-1" id="ddns-state"></div>
                <div class="grid grid-cols-2 gap-3">
                    <button id="ddns-save" class="w-full rounded bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm py-2.5 transition">保存設定</button>
                    <button id="ddns-sync" class="w-full rounded border border-emerald-500/60 hover:border-emerald-300 text-emerald-200 font-bold text-sm py-2.5 transition">立即同步</button>
                </div>
            </div>
        </div>
    </div>
