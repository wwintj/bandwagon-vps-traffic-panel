    <div id="migrate-modal" class="modal-backdrop">
        <div class="card w-full max-w-lg max-h-[92vh] overflow-y-auto">
            <div class="flex items-start justify-between gap-4 mb-5">
                <div>
                    <h2 class="text-lg font-bold text-slate-100">切換服務器機房</h2>
                    <p class="text-xs text-slate-500 mt-1" id="migrate-status">先讀取可用機房，再確認切換</p>
                </div>
                <button class="settings-close text-slate-400 hover:text-white text-xl leading-none" data-modal="migrate-modal">&times;</button>
            </div>
            <div class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <label class="block text-xs text-slate-400 uppercase">Bandwagon VEID
                        <input id="migrate-veid" class="form-input" autocomplete="off">
                    </label>
                    <label class="block text-xs text-slate-400 uppercase">Bandwagon API Key
                        <input id="migrate-api-key" type="password" class="form-input" autocomplete="off">
                    </label>
                </div>
                <label class="block text-xs text-slate-400 uppercase">可切換機房
                    <select id="migrate-location" class="form-input"></select>
                </label>
                <div class="grid grid-cols-2 gap-3">
                    <button id="migrate-load" class="w-full rounded border border-violet-500/60 hover:border-violet-300 text-violet-200 font-bold text-sm py-2.5 transition">讀取機房</button>
                    <button id="migrate-start" class="w-full rounded bg-violet-500 hover:bg-violet-400 text-slate-950 font-bold text-sm py-2.5 transition">確認切換</button>
                </div>
                <div class="border-t border-slate-700 pt-4 space-y-2">
                    <h3 class="text-sm font-bold text-slate-200">重啟 VPS</h3>
                    <p class="text-[11px] text-slate-500" id="restart-status">透過 KiwiVM API 重啟整台 VPS，面板會中斷約 1 分鐘，恢復後自動通知。</p>
                    <button id="vps-restart" class="w-full rounded border border-red-500/60 hover:bg-red-500/10 text-red-300 font-bold text-sm py-2.5 transition">重啟 VPS</button>
                </div>
            </div>
        </div>
    </div>
