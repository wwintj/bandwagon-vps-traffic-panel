name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.8"
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in panel.sh scripts/*.sh tests/e2e/*.sh; do bash -n "$f"; done
      - run: shellcheck -S error panel.sh scripts/*.sh tests/e2e/*.sh

  e2e:
    # Full install -> certificate renewal -> update -> uninstall on a real systemd host.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo bash tests/e2e/run.sh
