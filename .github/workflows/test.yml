name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.8"
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  css:
    # The committed app/static/panel.css must match what Tailwind builds from the templates.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes tailwindcss@3.4.16 -c tailwind.config.js -i app/static/src/panel.input.css -o app/static/panel.css --minify
      - run: git diff --exit-code app/static/panel.css || (echo "panel.css is stale - rebuild it with the command in tailwind.config.js" && exit 1)

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in panel.sh scripts/*.sh tests/e2e/*.sh; do bash -n "$f"; done
      - run: shellcheck -S error panel.sh scripts/*.sh tests/e2e/*.sh

  e2e:
    # Full install -> HTTPS -> certificate renewal / switch -> update -> uninstall on real systemd hosts.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04 nginx
            runner: ubuntu-24.04
            script: run.sh
          - name: ubuntu-22.04 nginx
            runner: ubuntu-22.04
            script: run.sh
          - name: ubuntu-24.04 direct https
            runner: ubuntu-24.04
            script: run_direct.sh
    name: e2e (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo bash tests/e2e/${{ matrix.script }}

  e2e-debian:
    # Debian 12 has no hosted runner: run the same script inside a container with systemd as PID 1.
    name: e2e (debian 12 nginx)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -q -t panel-debian12 -f tests/e2e/debian12.Dockerfile tests/e2e
      - run: >
          docker run -d --name deb --privileged --cgroupns=host
          -v /sys/fs/cgroup:/sys/fs/cgroup:rw --tmpfs /run --tmpfs /run/lock panel-debian12
      - run: |
          docker cp . deb:/opt/vps-traffic-panel-src
          for _ in $(seq 1 60); do
            state=$(docker exec deb systemctl is-system-running 2>/dev/null || true)
            case "$state" in running|degraded) break ;; esac
            sleep 1
          done
          echo "systemd: $state"
      - run: docker exec deb bash /opt/vps-traffic-panel-src/tests/e2e/run.sh
